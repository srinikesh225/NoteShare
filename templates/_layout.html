{# Layout helpers. #}

{# items: list of (label, url) pairs; the last item is the current page. #}
{% macro breadcrumbs(items) -%}
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <ol>
      {% for label, url in items %}
        <li>
          {%- if url and not loop.last -%}
            <a href="{{ url }}">{{ label }}</a>
          {%- else -%}
            <span aria-current="page">{{ label }}</span>
          {%- endif -%}
        </li>
      {% endfor %}
    </ol>
  </nav>
{%- endmacro %}
