{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block description %}{{ title }}{% endblock %}

{% block content %}
<section class="page error-page" aria-labelledby="error-heading">
  <p class="error-code">Error {{ code }}</p>
  <h1 id="error-heading">{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a class="button button--secondary" href="{{ url_for('index') }}">Go to NoteShare home</a></p>
</section>
{% endblock %}
